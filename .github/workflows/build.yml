name: Build iOS App

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Build Project
        run: |
          echo "Searching for Xcode workspace or project..."
          
          # Find the directory containing the .xcworkspace or .xcodeproj file
          PROJECT_PATH=$(find . -name "*.xcworkspace" -o -name "*.xcodeproj" -print -quit)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: No Xcode project or workspace found in the repository!"
            exit 1
          fi
          
          # Get the parent directory and file name
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH")
          
          echo "Found project at: $PROJECT_DIR/$PROJECT_NAME"
          cd "$PROJECT_DIR"
          
          # Build depending on whether it's a workspace or project
          if [[ "$PROJECT_NAME" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJECT_NAME" \
                       -scheme "$(basename "$PROJECT_NAME" .xcworkspace)" \
                       -sdk iphoneos \
                       -configuration Release \
                       CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
                       build
          else
            xcodebuild -project "$PROJECT_NAME" \
                       -scheme "$(basename "$PROJECT_NAME" .xcodeproj)" \
                       -sdk iphoneos \
                       -configuration Release \
                       CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
                       build
          >
        shell: bash
