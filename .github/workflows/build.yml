name: Build iOS App

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: List All Repository Files
        run: |
          echo "=== Listing all files in repository ==="
          find . -maxdepth 3 -not -path '*/.*'
        shell: bash

      - name: Search for Xcode Project Files
        run: |
          echo "Searching for Xcode workspace or project..."
          PROJECT_PATH=$(find . -name "*.xcworkspace" -o -name "*.xcodeproj" -print -quit)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::No Xcode project or workspace found in the repository!"
            echo "Please check the file list above to see how this project is structured."
            exit 1
          else
            echo "Found project at: $PROJECT_PATH"
          fi
        shell: bash
