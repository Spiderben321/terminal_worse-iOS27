name: Inspect Repository

on:
  workflow_dispatch:

jobs:
    inspect:
      runs-on: macos-latest

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: List All Files in Repository
          run: |
            echo "=== DIRECTORY STRUCTURE ==="
            find . -maxdepth 3 -not -path '*/.*' | sort
          shell: bash
