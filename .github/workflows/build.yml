name: Build iOS App

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lief
        shell: bash

      - name: Run Build and Injection Scripts
        run: |
          echo "=== Making scripts executable ==="
          chmod +x scripts/*.sh
          
          echo "=== Running build_dylib.sh ==="
          ./scripts/build_dylib.sh
          
          echo "=== Running inject_dylib.py ==="
          python3 scripts/inject_dylib.py
          
          echo "=== Running sign_all.sh ==="
          ./scripts/sign_all.sh
        shell: bash

      - name: Package Output into an IPA
        run: |
          echo "=== Packaging compiled app into an IPA ==="
          mkdir -p Payload
          
          # Look for any generated .app bundle in common output directories and move it to Payload
          if [ -d "build" ]; then
            cp -r build/*.app Payload/ 2>/dev/null || true
          fi
          
          # Fallback check in case the app bundle is located elsewhere in the workspace
          if [ -d "out" ]; then
            cp -r out/*.app Payload/ 2>/dev/null || true
          fi
          
          # Check if the Payload folder successfully received the app bundle
          if [ -d "Payload" ] && [ "$(ls -A Payload)" ]; then
            echo "Found app bundle, compressing into app.ipa..."
            zip -r app.ipa Payload
            echo "Successfully created app.ipa!"
          else
            echo "Error: No .app bundle found inside build or out directories."
            echo "Listing current directory contents for debugging:"
            find . -maxdepth 2
            exit 1
          fi
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalWorse-IPA
          path: app.ipa
