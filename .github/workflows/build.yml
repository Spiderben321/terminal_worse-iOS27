name: Build and Inject IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL to the base IPA file'
        required: true
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lief
        shell: bash

      - name: Download Base IPA from Link
        run: |
          echo "Downloading base IPA from provided URL..."
          curl -L -o base.ipa "${{ github.event.inputs.ipa_url }}"
          
          # Verify the download succeeded
          if [ -f "base.ipa" ] && [ -s "base.ipa" ]; then
            echo "Successfully downloaded base.ipa!"
          else
            echo "Error: Failed to download a valid file from the provided URL."
            exit 1
          fi
        shell: bash

      - name: Run Build, Injection, and Signing Scripts
        run: |
          echo "=== Making scripts executable ==="
          chmod +x scripts/*.sh
          
          echo "=== 1. Building the dylib ==="
          ./scripts/build_dylib.sh
          
          echo "=== 2. Injecting dylib into the base IPA ==="
          python3 scripts/inject_dylib.py
          
          echo "=== 3. Signing the package ==="
          ./scripts/sign_all.sh
        shell: bash

      - name: Upload Final IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modified-Terminal-IPA
          path: |
            *.ipa
            build/*.ipa
            out/*.ipa
